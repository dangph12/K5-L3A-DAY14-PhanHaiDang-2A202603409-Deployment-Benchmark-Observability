# ============================================================
# TODO (tiêu chí 2): chạy agent + redis bằng một lệnh `docker compose up`
#   • service agent: build từ Dockerfile, map port 8000, đọc thêm env từ .env
#     (dùng `required: false` để không có file .env vẫn chạy được)
#   • service redis: image redis:7-alpine, có healthcheck
#   • agent có REDIS_URL=redis://redis:6379/0 và depends_on redis
# ============================================================
services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 8s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  redis_data:
